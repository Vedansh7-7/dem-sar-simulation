[project]
name = "sar-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.7",
    "lxml>=6.2.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.5",
    "planetary-computer>=1.0.0",
    "plotly>=7.2.0",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "segno>=1.6.6",
    "shapely>=2.2.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pymupdf>=2.2",
    "pytest>=9.2.0",
]
